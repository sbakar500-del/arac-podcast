name: Ses denemesi

# Yalnızca ses-denemesi dalında çalışır; yayına dokunmaz. Örnekleri bu dala (ornekler/) kaydeder.
on:
  push:
    branches: [ses-denemesi]
    paths: ["deneme/**", ".github/workflows/deneme.yml"]

permissions:
  contents: write

jobs:
  xtts:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "coqui-tts[codec]" six
      - run: python deneme/xtts_dene.py
      - name: Örnekleri dala kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ornekler/
          git commit -q -m "Ses örnekleri (${{ github.job }})"
          for i in 1 2 3 4 5; do git pull -q --rebase origin ses-denemesi && git push -q origin HEAD:ses-denemesi && break; sleep 5; done
